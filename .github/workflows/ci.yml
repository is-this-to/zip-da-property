name: Property API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: property-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      # Test sources are not yet maintained as a CI contract. Validate the
      # production source and deployable artifact until they are ready.
      - run: ./gradlew bootJar --no-daemon
      - name: Build container image
        run: docker build --tag zip-da-property:${{ github.sha }} .
