server:
  port: ${APP_PORT}

spring:
  application:
    name: zip-da-property
    version: v1
  web:
    error:
      include-stacktrace: always
      include-message: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    defer-datasource-initialization: true
  sql:
    init:
      data-locations: classpath*:dummy/*.sql
      mode: never
      platform: all

  # kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: zip-da-property
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 아래에 추가설정 필요

property:
  kafka:
    topic: ${PROPERTY_KAFKA_TOPIC:zipda.property.events.v1}

# Springdoc Openapi
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs
  open-api:
    - url: ${GATEWAY_URI}
      description: ${APP_DESCRIPTION}

# Log
logging:
  file:
    name: logs/zip-da-property.log
  level:
    root: info
    com.zipdaproperty: debug
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] [traceId=%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] [traceId=%X{traceId}] %logger{36} - %msg%n"

# minio
minio:
  minio-endpoint: ${MINIO_ENDPOINT}
  minio-bucket: ${MINIO_BUCKET}
  minio-access-key: ${MINIO_ACCESS_KEY}
  minio-secret-key: ${MINIO_SECRET_KEY}
  minio-image-path: ${MINIO_IMAGE_PATH}
  allow-image-extensions: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/webp"
  ]

# Kakao Local REST API 설정
external-api:
  kakao-local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_LOCAL_REST_API_KEY}
    connect-timeout: ${KAKAO_LOCAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_LOCAL_READ_TIMEOUT:5s}
    page-size: ${KAKAO_LOCAL_PAGE_SIZE:10}

# 매물 위치 검증 설정
property:
  location:
    validation:
      min-longitude: ${PROPERTY_LOCATION_MIN_LONGITUDE:124}
      max-longitude: ${PROPERTY_LOCATION_MAX_LONGITUDE:132}
      min-latitude: ${PROPERTY_LOCATION_MIN_LATITUDE:33}
      max-latitude: ${PROPERTY_LOCATION_MAX_LATITUDE:39}
